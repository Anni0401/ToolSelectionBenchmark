# Joint Bayesian search over DPO and LoRA hyperparameters.
#
# Run from this directory:
#   wandb sweep sweep_joint.yaml
#   sbatch improvement-strategies/dpo-query-rewrite/slurm/slurm_dpo_sweep_agent.sh <SWEEP_ID> 12  # from the repo root
#
# The full discrete search space contains 1,728 combinations. The run cap limits
# the initial experiment to 48 trials; submit multiple agents with a per-agent
# count that sums to no more than the cap. The previous best baseline
# (lr=1e-5, beta=0.2, epochs=3, r=16, alpha=32, dropout=0.05) is in the search
# space, though Bayesian search is not guaranteed to select it.

program: run.sh
method: bayes
run_cap: 48
metric:
  name: eval_rewards/accuracies
  goal: maximize
parameters:
  learning-rate:
    values: [1.0e-6, 2.0e-6, 5.0e-6, 1.0e-5]
  beta:
    values: [0.05, 0.1, 0.2]
  epochs:
    values: [1, 2, 3]
  lora-r:
    values: [8, 16, 32, 64]
  lora-alpha:
    values: [16, 32, 64, 128]
  lora-dropout:
    values: [0.0, 0.05, 0.1]
command:
  - ${env}
  - bash
  - ${program}
  - ${args}