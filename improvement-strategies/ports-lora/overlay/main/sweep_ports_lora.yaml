# Follow-up W&B sweep: LoRA parameters for PORTS training, with the other
# hyperparameters held fixed to the best run of sweep_ports.yaml (NDCG@5 = 0.750).
#
# Usage (from the `ports/main` directory):
#   wandb sweep sweep_ports_lora.yaml
#   sbatch scripts/slurm_wandb_sweep_agent.sh <SWEEP_ID>
# Full grid is 4 (r) * 4 (alpha) * 3 (dropout) = 48; cap total runs via: wandb agent --count N <SWEEP_ID>
# Baseline (r=16, alpha=32, dropout=0.05) is included in the search space.
# Start a fresh sweep per DATASET_NAME (see sweep_ports.yaml).

program: scripts/train_ports_sweep.sh
method: random
metric:
  name: eval/cosine_ndcg_at_5
  goal: maximize
parameters:
  lr:
    value: 1e-6
  n_epochs:
    value: 2
  lambda_loss:
    value: 0.3
  beta:
    value: 0.5
  gamma:
    value: 1.0
  train_batch_size:
    value: 2
  gradient_accumulation_steps:
    value: 32
  lora_r:
    values: [8, 16, 32, 64]
  lora_alpha:
    values: [16, 32, 64, 128]
  lora_dropout:
    values: [0.0, 0.05, 0.1]
command:
  - ${env}
  - bash
  - ${program}
  - ${args}
