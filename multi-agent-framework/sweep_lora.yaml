# Follow-up W&B sweep: LoRA parameters for DPO Qwen3-8B training, with the best
# lr/beta/epochs from sweep.yaml held fixed.
#
# Usage (from `multi-agent-framework`):
#   wandb sweep sweep_lora.yaml
#   sbatch ../deploy/slurm_dpo_sweep_agent.sh <SWEEP_ID> 12
# Full grid is 4 (r) * 4 (alpha) * 3 (dropout) = 48; random search capped via the run count.
# Baseline (r=16, alpha=32, dropout=0.05) is included in the search space.

program: run.sh
method: grid
metric:
  name: eval_rewards/accuracies
  goal: maximize
parameters:
  learning-rate:
    value: 1e-5
  beta:
    value: 0.2
  epochs:
    value: 3
  lora-r:
    values: [8, 16, 32, 64]
  lora-alpha:
    values: [16, 32, 64, 128]
  lora-dropout:
    values: [0.0, 0.05, 0.1]
command:
  - ${env}
  - bash
  - ${program}
  - ${args}
